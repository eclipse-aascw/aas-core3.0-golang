version = 1

# Prose and metadata where a header would end up in the rendered output
# (e.g., README shown on GitHub and pkg.go.dev) or which can not carry
# a comment.
[[annotations]]
path = ["AUTHORS", "README.md"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 aas-core3.0-golang AUTHORS"
SPDX-License-Identifier = "MIT"

# The snippets are inserted verbatim into the generated code by aas-core-codegen,
# so they must not carry a header of their own.
[[annotations]]
path = "_dev_scripts/codegen/snippets/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 aas-core3.0-golang AUTHORS"
SPDX-License-Identifier = "MIT"

# Test data and the recorded test outputs are generated and compared
# byte-by-byte, and JSON can not carry a comment.
[[annotations]]
path = ["testdata/**", "testgen_rev.txt"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 aas-core3.0-golang AUTHORS"
SPDX-License-Identifier = "MIT"

# The checksum file is maintained by the Go tooling and can not carry a comment.
[[annotations]]
path = "go.sum"
precedence = "aggregate"
SPDX-FileCopyrightText = "2023 aas-core3.0-golang AUTHORS"
SPDX-License-Identifier = "MIT"
